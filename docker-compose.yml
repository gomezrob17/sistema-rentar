# Rentar Hito 3.
# Levantar con:  docker compose up -d --build
# Apagar con:    docker compose down
# Servicios gRPC: vehicle, customer y rental. Eventos por RabbitMQ.
services:
  db:
    image: postgres:16
    container_name: rentar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentar
      POSTGRES_PASSWORD: rentar
      # Base por defecto del contenedor. Solo guarda datos de Hito 1 para migrarlos con
      # infra/migrar-hito1.sh; las bases de los servicios las crea infra/postgres/init.
      POSTGRES_DB: rentar
    ports:
      # Puerto del host distinto de 5432 para no chocar con Postgres locales o rangos reservados por Windows.
      - "55432:5432"
    volumes:
      # Volumen nuevo: el de Hito 1 (rentar-pgdata) ya está inicializado y no correría el init.
      - rentar-pgdata-h2:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentar -d rentar"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: rentar-rabbitmq
    # El nombre del nodo sale del hostname: fijo para que los datos del volumen sobrevivan
    # a la recreación del contenedor.
    hostname: rentar-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rentar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rentar}
    ports:
      # Puertos del host en el rango 55xxx, igual que el resto (Windows reserva otros rangos).
      - "55672:5672"   # AMQP
      - "55673:15672"  # UI de management: http://localhost:55673
    volumes:
      - rentar-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle_service/Dockerfile
    container_name: rentar-vehicle-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rentar:rentar@db:5432/rentar_vehiculos
      GRPC_PORT: 50051
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rentar}:${RABBITMQ_PASSWORD:-rentar}@rabbitmq:5672/%2F
    ports:
      # Puerto del host distinto de 50051 (rango reservado por Windows).
      - "55051:50051"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; g.HealthStub(grpc.insecure_channel('localhost:50051')).Check(h.HealthCheckRequest(), timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build:
      context: .
      dockerfile: services/customer_service/Dockerfile
    container_name: rentar-customer-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rentar:rentar@db:5432/rentar_clientes
      GRPC_PORT: 50052
      # Usuario administrador que se crea al arrancar si no existe (valores de desarrollo).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@unla.com.ar}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123}
    ports:
      # Puerto del host distinto de 50052 (rango reservado por Windows).
      - "55052:50052"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; g.HealthStub(grpc.insecure_channel('localhost:50052')).Check(h.HealthCheckRequest(), timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10

  rental-service:
    build:
      context: .
      dockerfile: services/rental_service/Dockerfile
    container_name: rentar-rental-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rentar:rentar@db:5432/rentar_alquileres
      GRPC_PORT: 50053
    ports:
      # Puerto del host distinto de 50053 (rango reservado por Windows).
      - "55053:50053"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; from grpc_health.v1 import health_pb2 as h, health_pb2_grpc as g; g.HealthStub(grpc.insecure_channel('localhost:50053')).Check(h.HealthCheckRequest(), timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 10

  # Worker sin gRPC: consume los pedidos de verificación y publica el resultado.
  verification-service:
    build:
      context: .
      dockerfile: services/verification_service/Dockerfile
    container_name: rentar-verification-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rentar:rentar@db:5432/rentar_verificaciones
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rentar}:${RABBITMQ_PASSWORD:-rentar}@rabbitmq:5672/%2F
      # La validación de titularidad consulta el documento del cliente por gRPC.
      CUSTOMER_SERVICE_URL: customer-service:50052
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      customer-service:
        condition: service_healthy

  gateway:
    build:
      # Contexto en la raíz para que la imagen incluya proto/.
      context: .
      dockerfile: gateway/Dockerfile
    container_name: rentar-gateway
    restart: unless-stopped
    # Sin DATABASE_URL: el gateway no accede a ninguna base, solo habla gRPC con los servicios.
    environment:
      JWT_SECRET: ${JWT_SECRET:-rentar-dev-secret}
      PORT: 3000
      VEHICLE_SERVICE_URL: vehicle-service:50051
      CUSTOMER_SERVICE_URL: customer-service:50052
      RENTAL_SERVICE_URL: rental-service:50053
    ports:
      - "3000:3000"
    depends_on:
      vehicle-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      rental-service:
        condition: service_healthy

volumes:
  rentar-pgdata-h2:
  rentar-rabbitmq:
