// Contrato del Customer Service (Hito 2, punto 3).
//
// Convenciones:
// - Fechas: string ISO-8601. `fecha_nacimiento` puede venir solo con la fecha
//   ("1990-05-20"); el servicio la guarda y la devuelve en ISO-8601 completo.
// - Campos `optional`: permiten distinguir "no enviado" de "valor vacío"
//   (ediciones parciales y filtros).
// - Errores: códigos de estado gRPC con un mensaje en español. El API Gateway
//   los traduce a HTTP: INVALID_ARGUMENT y FAILED_PRECONDITION -> 400,
//   NOT_FOUND -> 404, ALREADY_EXISTS -> 409, UNAUTHENTICATED -> 401.
syntax = "proto3";

package rentar.clientes.v1;

// Servicio dueño de los clientes y de sus usuarios: alta, consulta, edición,
// baja lógica, autenticación y las validaciones propias del dominio
// (existencia y estado activo).
service CustomerService {
  // Da de alta un cliente activo y, en la misma transacción, su usuario
  // (rol CLIENTE) con la contraseña temporal "Usuario{id}*".
  // Errores: INVALID_ARGUMENT (datos inválidos), ALREADY_EXISTS (documento o email repetido).
  rpc CrearCliente(CrearClienteRequest) returns (Cliente);

  // Lista clientes ordenados por id, incluidos los dados de baja.
  // Sin filtros devuelve todos. Los filtros enviados se combinan entre sí.
  rpc ListarClientes(FiltroClientes) returns (ListaClientes);

  // Devuelve un cliente.
  // Errores: NOT_FOUND.
  rpc BuscarClientePorId(ClienteId) returns (Cliente);

  // Edición parcial: solo cambia los campos enviados. Si cambia el email,
  // también se actualiza el del usuario del cliente.
  // Errores: NOT_FOUND, INVALID_ARGUMENT, ALREADY_EXISTS (documento o email repetido).
  rpc ActualizarCliente(ActualizarClienteRequest) returns (Cliente);

  // Baja lógica: el cliente pasa a activo = false.
  // Errores: NOT_FOUND.
  rpc DarDeBajaCliente(ClienteId) returns (Cliente);

  // Verifica si existe un cliente con ese id (esté activo o no).
  rpc ExisteCliente(ClienteId) returns (Existencia);

  // Verifica que el cliente exista y esté activo antes de reservarlo.
  // Devuelve el cliente para tomar sus datos del momento.
  // Errores: NOT_FOUND, FAILED_PRECONDITION (cliente dado de baja).
  rpc ValidarClienteParaReserva(ClienteId) returns (Cliente);

  // Verifica email y contraseña. El email no distingue mayúsculas ni espacios.
  // El usuario tiene que estar activo y, si es CLIENTE, también su cliente.
  // Errores: UNAUTHENTICATED (credenciales inválidas o usuario inactivo).
  rpc Autenticar(Credenciales) returns (UsuarioAutenticado);

  // Cambia la contraseña de un usuario después de verificar la actual.
  // Errores: UNAUTHENTICATED (usuario inválido o contraseña actual incorrecta),
  // INVALID_ARGUMENT (contraseña nueva de menos de 8 caracteres).
  rpc CambiarContrasena(CambiarContrasenaRequest) returns (ContrasenaActualizada);
}

// Roles de un usuario. Mismos valores que en Hito 1.
enum RolUsuario {
  ROL_USUARIO_SIN_ESPECIFICAR = 0;
  CLIENTE = 1;
  ADMIN = 2;
}

// Credenciales de inicio de sesión.
message Credenciales {
  string email = 1;
  string password = 2;
}

// Usuario autenticado. El API Gateway firma el JWT con estos datos.
message UsuarioAutenticado {
  int32 usuario_id = 1;
  RolUsuario rol = 2;
  // Ausente para el administrador, que no tiene un cliente asociado.
  optional int32 cliente_id = 3;
  // "Nombre Apellido" del cliente, o "Administrador".
  string nombre = 4;
  string email = 5;
}

// Cambio de contraseña de un usuario.
message CambiarContrasenaRequest {
  int32 usuario_id = 1;
  string actual = 2;
  string nueva = 3;
}

// Confirmación de un cambio de contraseña (sin datos).
message ContrasenaActualizada {}

// Cliente completo, tal como lo devuelve el servicio.
message Cliente {
  int32 id = 1;
  // Único.
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  // Único.
  string email = 5;
  // Ausente si no se cargó.
  optional string telefono = 6;
  // Ausente si no se cargó.
  optional string fecha_nacimiento = 7;
  // false cuando el cliente fue dado de baja.
  bool activo = 8;
  string created_at = 9;
  string updated_at = 10;
}

// Identificador de un cliente.
message ClienteId {
  int32 id = 1;
}

// Resultado de una verificación de existencia.
message Existencia {
  bool existe = 1;
}

// Lista de clientes.
message ListaClientes {
  repeated Cliente clientes = 1;
}

// Datos del alta. Validaciones: documento, nombre y apellido no vacíos,
// email con formato válido y fecha de nacimiento válida si se envía.
message CrearClienteRequest {
  string documento = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  optional string telefono = 5;
  optional string fecha_nacimiento = 6;
}

// Edición parcial: solo se modifican los campos enviados, con las mismas
// validaciones que el alta.
message ActualizarClienteRequest {
  int32 id = 1;
  optional string documento = 2;
  optional string nombre = 3;
  optional string apellido = 4;
  optional string email = 5;
  optional string telefono = 6;
  optional string fecha_nacimiento = 7;
}

// Filtros de ListarClientes. Todos son opcionales.
message FiltroClientes {
  // Solo los clientes con estos ids. Vacío: sin filtro por id.
  repeated int32 ids = 1;
  // Busca en nombre, apellido, documento o email, sin distinguir mayúsculas.
  optional string texto = 2;
}
